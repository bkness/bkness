<svg width="600" height="92" viewBox="0 0 600 92" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Scanline pattern -->
    <pattern id="scan" x="0" y="0" width="600" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="600" height="1" fill="rgba(0,255,65,0.025)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="92" rx="10" fill="#020a04"/>

  <!-- Outer border glow -->
  <rect x="1" y="1" width="598" height="90" rx="9" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="0.5" y="0.5" width="599" height="91" rx="10" fill="none" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.1"/>

  <!-- Scanlines -->
  <rect width="600" height="92" rx="10" fill="url(#scan)"/>

  <!-- ── Mini asteroids scene (left panel) ── -->

  <!-- Asteroid 1 (large-ish) -->
  <polygon points="54,22 62,16 72,18 76,26 72,36 62,38 53,33 50,26"
    fill="none" stroke="#2a4a2e" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Asteroid 2 (small) -->
  <polygon points="84,54 89,50 95,52 97,58 93,63 86,62 82,58"
    fill="none" stroke="#1e3a22" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Asteroid 3 (tiny) -->
  <polygon points="28,60 32,57 37,59 38,64 34,67 29,66"
    fill="none" stroke="#1a3020" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Ship (triangle, pointing up, slightly angled — mid-action) -->
  <polygon points="68,68 60,82 76,82"
    fill="none" stroke="#00ff41" stroke-width="2" stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- Thruster flame -->
  <polygon points="63,83 68,92 73,83" fill="#ffd43b" opacity="0.75"/>
  <polygon points="65,83 68,89 71,83" fill="#ff8c00" opacity="0.5"/>

  <!-- Bullet (mid-flight toward asteroid) -->
  <line x1="68" y1="48" x2="68" y2="56" stroke="#00ff41" stroke-width="2"
    stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

  <!-- Vertical divider -->
  <line x1="112" y1="14" x2="112" y2="78" stroke="#1a3a22" stroke-width="1"/>

  <!-- ── Text content ── -->

  <!-- Main label -->
  <text x="136" y="42" fill="#00ff41" font-size="26" font-weight="700"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    filter="url(#softglow)">▶ PLAY ASTEROIDS</text>

  <!-- Sub label -->
  <text x="138" y="64" fill="#2a5a32" font-size="13"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    slack off  →  bkness.dev
  </text>

  <!-- Score label (top right corner detail) -->
  <text x="506" y="22" fill="#1a3a22" font-size="10"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HI-SCORE</text>
  <text x="506" y="36" fill="#2a5a32" font-size="12" font-weight="700"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">004800</text>

  <!-- INSERT COIN prompt (bottom right) -->
  <text x="468" y="74" fill="#1a3a22" font-size="10"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">▸ INSERT COIN</text>
</svg>
